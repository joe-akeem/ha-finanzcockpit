# Das Finanzcockpit bringt sein Dashboard selbst mit. Es gibt zwei Wege:
#
# 1. Automatisch: Option «Dashboard in der Seitenleiste anzeigen» beim Einrichten
#    oder später unter Einstellungen → Geräte & Dienste → Finanzcockpit → ⚙.
#
# 2. Eigenes, bearbeitbares Dashboard: Einstellungen → Dashboards → Dashboard
#    hinzufügen → «Neu beginnen», dann ✎ → ⋮ → Raw-Konfigurationseditor und
#    die folgende Zeile einfügen. Das Dashboard baut sich aus den Sensoren auf.
#    Mit ✎ → «Kontrolle übernehmen» lässt es sich danach frei anpassen.
strategy:
  type: custom:finanzcockpit

