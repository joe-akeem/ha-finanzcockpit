[project]
name = "ha-finanzcockpit"
version = "0.1.0"
description = "Home-Assistant-Integration: Kontostände aus YAML/CSV als Sensoren, gruppiert nach Töpfen"
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PL"]
ignore = [
    "PLR2004", # Zahlen in Tests sind ok
    "RUF001",  # Typografische Zeichen (’, «») sind gewollt
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
